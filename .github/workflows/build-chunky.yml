name: Build Chunky APKs

on:
  push:
    branches: [main]
    paths:
      - 'Chunky/**'
      - '.github/workflows/build-chunky.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build signed debug APKs
        run: gradle -p Chunky :app:assembleDebug --stacktrace

      - name: Verify Fire TV APK
        shell: bash
        run: |
          set -euo pipefail
          apk="Chunky/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          test -s "$apk"
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging "$apk" | grep -F "package: name='com.example.tvbrowser'"
          aapt dump badging "$apk" | grep -F "sdkVersion:'26'"
          aapt dump badging "$apk" | grep -F "leanback-launchable-activity:"
          unzip -Z1 "$apk" | grep -E '^lib/armeabi-v7a/.*\.so$'
          if unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/'; then
            echo "Unexpected arm64-v8a library in the 32-bit APK" >&2
            exit 1
          fi
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose "$apk"
          sha256sum "$apk"

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: chunky-debug-apks
          path: Chunky/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
